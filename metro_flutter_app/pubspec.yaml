name: metro_flutter_app
description: "Metro Telecom - Native Android POS & Inventory Management App"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: any
  http: ^1.2.1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
