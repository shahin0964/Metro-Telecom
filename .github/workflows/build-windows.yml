name: Build Windows Desktop App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Apps (Installer + Portable)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Metro-Telecom-Windows-Apps
          path: dist/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Metro Telecom POS v1.0.0 - Windows Release"
          body: |
            ## 📱 Metro Telecom POS & Stock Management Desktop Application

            ### 📥 Download Options:
            * **Installer (.exe)**: `Metro-Telecom-Setup-1.0.0.exe` (ইনস্টল করার জন্য, ডেস্কটপ আইকন তৈরি হবে)
            * **Portable (.exe)**: `Metro-Telecom-Portable-1.0.0.exe` (ইনস্টল ছাড়া সরাসরি পেনড্রাইভ বা কম্পিউটার থেকে চলবে)

            ### 🚀 Features:
            * 📸 ছবি সহ পণ্য যোগ ও ইনভেন্টরি ম্যানেজমেন্ট
            * ⚡ দ্রুত মাল্টি-আইটেম পিওএস ও ক্যাশ মেমো
            * 🛡️ ডিজিটাল ওয়ারেন্টি ও IMEI/Serial ট্র্যাকিং
            * 📊 ড্যাশবোর্ড ও ৭ দিনের বিক্রয় চিত্র
            * 📒 বাকির খাতা ও খরচ নিয়ন্ত্রণ
            * 🖨️ A4 ও A5 ক্যাশ মেমো প্রিন্ট
          files: dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
