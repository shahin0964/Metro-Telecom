name: Unified Multi-Platform Build (Web, Windows PC & Android Mobile)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "unified-build"
  cancel-in-progress: false

jobs:
  # 1. WEB SOFTWARE DEPLOYMENT (GitHub Pages)
  deploy-web:
    name: 🌐 Deploy Live Web Software
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Bundle
        run: npm run build:web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. WINDOWS PC BUILD (.exe Installer & Portable)
  build-windows:
    name: 💻 Build Windows Desktop (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Apps (Installer + Portable)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Metro-Telecom-Windows
          path: dist/*.exe

  # 3. ANDROID MOBILE APP BUILD (Native Flutter .apk)
  build-android:
    name: 📱 Build Android Mobile (Flutter .apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Flutter Project
        run: |
          cd metro_flutter_app
          flutter create . --org com.metro --project-name metro_flutter_app --platforms=android
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.metro.telecom">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>

              <application
                  android:label="Metro Telecom"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/LaunchTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF
          for dir in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-${dir}
            cp assets/icon.png android/app/src/main/res/mipmap-${dir}/ic_launcher.png
          done
          flutter pub get

      - name: Build Flutter Release APK
        run: |
          cd metro_flutter_app
          flutter build apk --release
          mkdir -p ../dist-apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/Metro-Telecom.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metro-Telecom-Android-APK
          path: dist-apk/*.apk

  # 4. UNIFIED RELEASE PUBLISHER (Publish All to GitHub Releases)
  publish-release:
    name: 🚀 Publish Unified Release (PC + Mobile)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Metro-Telecom-Windows
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Metro-Telecom-Android-APK
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets/

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Metro Telecom v1.0.0 (Windows PC, Android Mobile & Web)"
          body: |
            # 🏪 Metro Telecom - Unified Multi-Platform Release (v1.0.0)
            > **"এক হোস্টিং, এক মাথা, পথ ৩টা"** — PC, Android Mobile ও Web সফটওয়্যার একই ক্লাউড ডাটাবেজে রিয়েল-টাইমে সংযুক্ত!

            ---

            ### 📱 1. Android Mobile App (Native Flutter App):
            * **Android APK**: `Metro-Telecom.apk` (লেটেস্ট ফ্ল্যাটার ও মেটেরিয়াল ৩ ডার্ক থিমে নির্মিত নেটিভ অ্যান্ড্রয়েড অ্যাপ — মোবাইলে ক্যাশ মেমো, ব্লুটুথ থার্মাল প্রিন্ট, বারকোড এবং ক্লাউড সিঙ্কসহ পরিচালনা করুন)

            ### 💻 2. Windows PC Software:
            * **Installer**: `Metro-Telecom-Setup-1.0.0.exe` (ইনস্টল করুন, ডেস্কটপ আইকন তৈরি হবে)
            * **Portable**: `Metro-Telecom-Portable-1.0.0.exe` (কোনো ইনস্টলেশন ছাড়াই সরাসরি রান করুন)

            ### 🌐 3. Live Web Software:
            * **Web App URL**: [https://shahin0964.github.io/Metro-Telecom/](https://shahin0964.github.io/Metro-Telecom/)
            *(যেকোনো কম্পিউটার বা মোবাইল ব্রাউজারে লগইন করে সরাসরি ব্যবহার করুন)*

            ---

            ### 🌟 প্রধান সুবিধাসমূহ:
            * ☁️ **রিয়েল-টাইম ক্লাউড সিঙ্ক**: মোবাইলে সেল বা স্টক যোগ করলে সাথে সাথে পিসির সফটওয়্যার ও ওয়েব ভার্সনে আপডেট।
            * 📱 **নেটিভ ফ্ল্যাটার অ্যান্ড্রয়েড আর্কিটেকচার**: ফুল মেটেরিয়াল ৩ ডিজাইন, হাইপার-ফ্লুয়েন্ট বটম শীট মেমো এবং অফলাইন-ফার্স্ট ক্যাশিং।
            * 🔄 **ইন-অ্যাপ অটো-আপডেট**: সফটওয়্যারের ভেতর থেকেই ১-ক্লিকে নতুন ভার্সন ডাউনলোড ও ইনস্টল।
            * 🔔 **পিসি ডেস্কটপ নোটিফিকেশন**: নতুন আপডেট আসলে উইন্ডোজ পিসিতে নোটিফিকেশন অ্যালার্ট।
            * 📦 **কাস্টম ও ডাইনামিক ক্যাটাগরি**: মোবাইল, হেডফোন, খেলনা, লাইট, স্টেশনারি, ইলেকট্রনিক্স ও আনলিমিটেড নতুন ক্যাটাগরি।
            * ⚡ **দ্রুত POS বিলিং ও ক্যাশ মেমো**: একসাথে একাধিক পণ্য বিক্রি ও A4/A5/Thermal প্রিন্ট।
            * 🛡️ **ডিজিটাল ওয়ারেন্টি ও সিরিয়াল ট্র্যাকিং**: IMEI/Serial ট্র্যাকিং ও মেয়াদ যাচাই।
            * 📒 **বার্ষিক ও মাসিক হিসাব খাতা**: সম্পূর্ণ বাৎসরিক ও মাসিক টার্নওভার, আসল ক্রয়মূল্য, খরচ ও নিট লাভ অডিট।
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
